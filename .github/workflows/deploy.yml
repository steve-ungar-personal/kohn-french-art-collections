name: Deploy to Vercel

# Deploys main to production with the Vercel CLI, exactly like `vercel deploy --prod`
# run by hand. The Vercel project stays unconnected to this GitHub repo; this
# workflow is the only link, using the VERCEL_TOKEN repository secret.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Team loser-league / project kohn-french-art-collections (IDs, not secrets).
      VERCEL_ORG_ID: team_83QzLfE9jVzrVmsygkXjbB72
      VERCEL_PROJECT_ID: prj_8WM5P0SwxjhJWKSzZBMdzmPE6RKy
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check for token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add a VERCEL_TOKEN repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Deploy to production
        run: npx --yes vercel@65.14.0 deploy --prod --yes --token="$VERCEL_TOKEN"
